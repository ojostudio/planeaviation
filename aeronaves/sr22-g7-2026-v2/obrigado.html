    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .thank-you-container {
            text-align: center;
            max-width: 600px;
            padding: 50px;
            background: #1a1a1a;
            border-radius: 16px;
            border-top: 4px solid #d92323; /* A cor var(--red-premium) da LP */
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            animation: fadeUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-check {
            width: 80px;
            height: 80px;
            background-color: rgba(217, 35, 35, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
            color: #d92323;
        }

        .icon-check svg {
            width: 40px;
            height: 40px;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke: currentColor;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        p {
            color: #a0a0a0;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .btn-back {
            display: inline-block;
            background: linear-gradient(135deg, #d92323 0%, #8b1010 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 35px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 20px rgba(217, 35, 35, 0.3);
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(217, 35, 35, 0.5);
        }

        .brand-logo {
            margin-top: 40px;
            width: 140px;
            opacity: 0.5;
        }
    </style>

        <h1>Solicitação Recebida!</h1>
        <!-- O texto abaixo foi ajustado para fazer sentido com as novas perguntas -->
